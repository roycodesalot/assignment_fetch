<!DOCTYPE html>
<!--

  This is the index.html page for my TV Show Search application. It allows users to search for 
  shows using the TVmaze API, displaying dynamic info cards with posters, summaries, genres, 
  ratings, and top cast details.
-->
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TV Show Search</title>
        <link rel="stylesheet" href="style.css">
        <script defer src="script.js"></script>    
    </head>
    <body onload="initialize()">
        <form id="tv_form">
            <h1>TV Show Search</h1>
            <label for="tv_title">Search TV Show:</label><br>
    
            <input type="text" id="tv_title" name="tv_title">
            <button type="button" id="searchButton">Search</button>
        </form>
        <ul id="tv_list"></ul>
        <p id="error_message"></p>
        <footer>Credit By: <a href="https://www.tvmaze.com" target="_blank" rel="noopener noreferrer">TVmaze</a>
    </footer>
    </body>
</html>
